name: Experiment CI - maven test

on:
  push:
    branches:
      - edidada/master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MAVEN_OPTS: -Xmx2g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Full existing unit-test suite via Maven.
      - name: mvn test
        run: mvn -B -ntp test
